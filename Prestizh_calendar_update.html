/* PRESTIZH — refined visual identity and welcoming empty workspace */
:root{--accent:#b58a55;--accent-strong:#d5b17c;--accent-ink:#111216;--radius:18px}
:root[data-theme="light"]{--accent:#9a713f;--accent-strong:#b58a55;--accent-ink:#fff}
.brand-name{letter-spacing:1.2px;font-size:20px}.brand-name span{color:var(--accent)}.mobile-brand{letter-spacing:1px}
.brand-mark{background:linear-gradient(145deg,var(--accent-strong),var(--accent));color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 24%,transparent)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.btn-primary{background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:var(--accent-ink)}
.progress-track>i{background:linear-gradient(90deg,var(--accent),var(--accent-strong))}
.hero-card{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:radial-gradient(ellipse at 85% 30%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 36%),linear-gradient(118deg,#211d18 0%,#17171a 53%,#111218 100%)}
:root[data-theme="light"] .hero-card{background:linear-gradient(118deg,#f4ede3,#f7f5f1);color:#17191f;border-color:#e4d7c5}
.welcome-card{position:relative;overflow:hidden;padding:clamp(26px,5vw,48px);margin:8px 0 18px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:24px;background:radial-gradient(ellipse at 90% 15%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 38%),linear-gradient(130deg,var(--surface-2),var(--surface));box-shadow:var(--shadow)}
.welcome-card:after{content:"";position:absolute;width:220px;height:220px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:50%;right:-70px;bottom:-125px;box-shadow:0 0 0 22px color-mix(in srgb,var(--accent) 4%,transparent),0 0 0 46px color-mix(in srgb,var(--accent) 3%,transparent);pointer-events:none}
.welcome-mark{width:54px;height:54px;display:grid;place-items:center;margin-bottom:24px;border-radius:17px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.welcome-mark svg{width:28px;height:28px}.welcome-card h2{position:relative;z-index:1;margin:10px 0;font-size:clamp(25px,4vw,36px);letter-spacing:-1px}.welcome-card p{position:relative;z-index:1;max-width:510px;color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 22px}.welcome-actions{position:relative;z-index:1;display:flex;gap:9px;flex-wrap:wrap}
.welcome-lower{margin-top:16px}.start-steps{display:grid;gap:15px}.start-steps>div{display:flex;align-items:center;gap:13px}.start-steps b{font-size:12px;color:var(--accent);letter-spacing:1px}.start-steps strong,.start-steps small{display:block}.start-steps strong{font-size:12px}.start-steps small{font-size:10px;color:var(--muted);margin-top:2px}
.panel,.stat-card,.library-card,.exercise-card{box-shadow:0 8px 26px rgba(0,0,0,.045)}
@media(max-width:600px){.welcome-card{padding:25px 20px;border-radius:19px}.welcome-mark{margin-bottom:19px}.welcome-actions{flex-direction:column}.welcome-actions .btn{width:100%}.welcome-lower{grid-template-columns:1fr}}


/* PRESTIZH MOTION SYSTEM */
:root{--motion-ease:cubic-bezier(.2,.75,.25,1)}
body{background-image:radial-gradient(ellipse at 82% 5%,rgba(237,70,88,.055),transparent 34%),radial-gradient(ellipse at 8% 88%,rgba(237,70,88,.035),transparent 32%);background-attachment:fixed}
.brand-mark{overflow:hidden;position:relative;border:1px solid rgba(244,209,122,.55);background:#101116;box-shadow:0 0 0 1px rgba(237,70,88,.12),0 7px 25px rgba(237,70,88,.18);animation:brandFloat 4.8s ease-in-out infinite}
.brand-mark img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.17);animation:brandGlow 4.8s ease-in-out infinite}
.brand-name{background:linear-gradient(100deg,var(--text) 15%,var(--accent-strong) 48%,var(--text) 78%);background-size:220% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:brandShine 7s linear infinite}
.mobile-brand .brand-mark{flex:none}
@keyframes brandFloat{0%,100%{transform:translateY(0);box-shadow:0 0 0 1px rgba(237,70,88,.12),0 7px 25px rgba(237,70,88,.18)}50%{transform:translateY(-2px);box-shadow:0 0 0 2px rgba(237,70,88,.18),0 10px 30px rgba(237,70,88,.28)}}
@keyframes brandGlow{0%,100%{filter:brightness(.96) saturate(1)}50%{filter:brightness(1.14) saturate(1.13)}}
@keyframes brandShine{to{background-position:220% center}}
.content.view-enter{animation:viewIn .48s var(--motion-ease) both}
.panel,.stat-card,.hero-card,.more-link,.nutrition-summary,.schedule-card{animation:surfaceRise .55s var(--motion-ease) both}
.panel:nth-of-type(2),.stat-card:nth-child(2){animation-delay:.045s}
.panel:nth-of-type(3),.stat-card:nth-child(3){animation-delay:.09s}
.panel:nth-of-type(4),.stat-card:nth-child(4){animation-delay:.135s}
@keyframes surfaceRise{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
.btn-primary{box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 22%,transparent);position:relative;overflow:hidden}
.btn-primary:after{content:"";position:absolute;inset:-40% auto -40% -55%;width:34%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .65s ease}
.btn-primary:hover:after{left:130%}
.nav-item,.icon-btn,.choice,.more-link,.date-shift{transition:all .24s var(--motion-ease)}
.nav-item.active{box-shadow:inset 3px 0 0 var(--accent)}
.hero-card{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.live-dot{animation:livePulse 2.2s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 38%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.orb{border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.orb:before,.orb:after{background:var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.progress-track>i,.nutrition-track>i,.water-track>i{transition:width .8s var(--motion-ease)}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}


/* Calendar: clear full-cell status colors */
.calendar-day.scheduled{
  background:color-mix(in srgb,var(--red) 13%,var(--surface-2));
  border-color:color-mix(in srgb,var(--red) 38%,var(--line));
  color:var(--red);font-weight:800
}
.calendar-day.completed{
  background:color-mix(in srgb,var(--green) 82%,var(--surface));
  border-color:var(--green);color:#071a11;font-weight:900
}
.calendar-day.missed{
  background:color-mix(in srgb,var(--red) 82%,var(--surface));
  border-color:var(--red);color:#fff;font-weight:900
}
.calendar-day.today:not(.completed):not(.missed){
  box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)
}
.calendar-day.completed.today,.calendar-day.missed.today{
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)
}
.calendar-day small{font-size:9px;font-weight:950}

const deep = x => JSON.parse(JSON.stringify(x));
const todayISO = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => new Date(`${s}T12:00:00`);
const fmtDate = (s, opts={day:'numeric',month:'short'}) => parseISO(s).toLocaleDateString(({uk:'uk-UA',en:'en-US',pl:'pl-PL'})[S?.language||'uk']||'uk-UA',opts);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadState(){let raw=null;try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){};const s=raw&&typeof raw==='object'?raw:{};return {logs:s.logs&&typeof s.logs==='object'?s.logs:{},body:Array.isArray(s.body)?s.body:[],start:s.start||todayISO(),plan:Array.isArray(s.plan)?s.plan:null,schedule:s.schedule&&typeof s.schedule==='object'?s.schedule:null,foodLogs:s.foodLogs&&typeof s.foodLogs==='object'?s.foodLogs:{},nutritionGoal:Number.isFinite(+s.nutritionGoal)&&+s.nutritionGoal>0?+s.nutritionGoal:null,theme:s.theme==='light'?'light':'dark',rest:[60,90,120,180].includes(+s.rest)?+s.rest:90,prof:s.prof||null,account:s.account&&typeof s.account==='object'?s.account:{name:'',goal:''},language:['uk','en','pl'].includes(s.language)?s.language:'uk',waterLogs:s.waterLogs&&typeof s.waterLogs==='object'?s.waterLogs:{},waterGoal:Number.isFinite(+s.waterGoal)&&+s.waterGoal>0?+s.waterGoal:2000};}

function getScheduleMap(){return S.schedule&&typeof S.schedule==='object'?S.schedule:{};}
function scheduledCount(){return Object.keys(getScheduleMap()).length;}
function schedule(date){const d=parseISO(date).getDay(),m=getScheduleMap();return Object.prototype.hasOwnProperty.call(m,d)?Math.max(0,Math.min(P.length-1,+m[d]||0)):undefined;}
function weekDayLabel(d){const names={uk:['Неділя','Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота'],en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],pl:['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota']};return (names[S?.language||'uk']||names.uk)[d];}
function doneDates(){return Object.keys(S.logs).filter(k=>S.logs[k]?.done);}
function sessionFor(date){return S.logs[date]||null;}
function sessionStats(date){const l=sessionFor(date);let total=0,done=0;if(!l)return {total:0,done:0};const plan=P[l.day]||P[0];(plan.e||[]).forEach((x,i)=>{const n=(+x[1]||0)+((l.ex||{})[i]||0);total+=n;done+=(l.sets?.[i]||[]).filter(s=>s?.ok).length;});return {total,done};}
function weeklyCount(){const d=parseISO(todayISO());const start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));let count=0;for(let i=0;i<7;i++){const x=new Date(start);x.setDate(start.getDate()+i);if(S.logs[iso(x)]?.done)count++;}return count;}
function totalVolume(){let v=0;for(const [date,l] of Object.entries(S.logs)){for(const sets of Object.values(l.sets||{})){(sets||[]).forEach(s=>{if(s?.ok)v+=(+s.w||0)*(+s.r||0);});}}return v;}
function streak(){let n=0,d=parseISO(todayISO());for(let i=0;i<180;i++){const s=iso(d),sc=schedule(s);if(sc!==undefined){if(S.logs[s]?.done)n++;else if(s<todayISO())break;else if(s===todayISO()&&!S.logs[s]?.done){/* today's session can still happen */}}d.setDate(d.getDate()-1);}return n;}
function levelInfo(){const n=doneDates().length,levels=['Початківець','Залізний','Боєць','Звір','Монстр','Легенда'];const lv=Math.min(5,Math.floor(n/8));return {n,lv,name:levels[lv],pct:lv===5?100:(n-lv*8)/8*100,next:(lv+1)*8};}
function getSelectedDay(){if(selectedDay===null){const sc=schedule(todayISO());selectedDay=sc!==undefined?sc:(S.logs[todayISO()]?.day??0);}selectedDay=Math.max(0,Math.min(P.length-1,selectedDay));return selectedDay;}
function ensureToday(){const d=todayISO();if(!S.logs[d])S.logs[d]={day:getSelectedDay(),sets:{},done:false};S.logs[d].day=getSelectedDay();S.logs[d].sets=S.logs[d].sets||{};return S.logs[d];}
function lastPerformance(name,index=0){const keys=Object.keys(S.logs).filter(k=>k<todayISO()).sort().reverse();for(const k of keys){const l=S.logs[k],plan=P[l.day]||P[0];for(const [ei,sets] of Object.entries(l.sets||{})){const ex=plan.e?.[+ei];for(const s of (sets||[])){const n=s?.n||ex?.[0];if(n===name&&(s?.ok||s?.w||s?.r)){return s;}}}}return null;}
function lastSetAt(name,index=0){const keys=Object.keys(S.logs).filter(k=>k<todayISO()).sort().reverse();for(const k of keys){const l=S.logs[k],plan=P[l.day]||P[0];for(const [ei,sets] of Object.entries(l.sets||{})){const ex=plan.e?.[+ei];if((sets||[]).some(s=>(s?.n||ex?.[0])===name)){const arr=sets||[];return arr[index]||arr.find(s=>s?.ok)||arr[arr.length-1]||null;}}}return null;}
function showToast(message){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),250);},2300);}

const scheduleHtml=`<section class="panel schedule-panel"><div class="section-head"><div><h2>Твій тижневий розклад</h2><p>Обирай будь-які дні. Кількість тренувань рахується автоматично.</p></div><span class="schedule-count">${scheduled.length} / 7 днів</span></div><div class="week-schedule">${days.map(x=>`<button class="schedule-day ${Object.prototype.hasOwnProperty.call(map,x.d)?'selected':''}" onclick="toggleScheduleDay(${x.d})"><span>${x.n}</span><i>${Object.prototype.hasOwnProperty.call(map,x.d)?'✓':'+'}</i></button>`).join('')}</div><div class="schedule-assignments">${scheduled.length?scheduled.map(x=>`<label class="schedule-assignment"><span><strong>${weekDayLabel(x.d)}</strong><small>Яке тренування виконувати</small></span><select class="field" onchange="setScheduledWorkout(${x.d},this.value)">${P.map((p,i)=>`<option value="${i}" ${+map[x.d]===i?'selected':''}>${i+1}. ${esc(p.n)}</option>`).join('')}</select></label>`).join(''):'<div class="empty-state">Поки немає тренувальних днів. Натисни «+» на будь-якому дні тижня.</div>'}</div><div class="notice" style="margin-top:14px">Дні відпочинку не рахуються як пропущені. Один шаблон можна призначити кільком дням або створити окремі програми.</div></section>`;
const planHtml=P.map((p,i)=>`<section class="panel plan-day"><div class="plan-day-head"><div style="flex:1;min-width:0"><div class="plan-day-title">Тренування ${i+1}</div><input class="field plan-name-field" type="text" maxlength="42" value="${esc(p.n)}" aria-label="Назва тренування" onchange="renamePlanDay(${i},this.value)"><div class="plan-day-sub">${p.e.length} вправ · ${p.e.reduce((a,x)=>a+(+x[1]||0),0)} підходів</div></div><div class="plan-actions"><button class="btn btn-secondary btn-small" onclick="openLibraryFor(${i})">${icon('plus')} Вправи</button><button class="remove-btn plan-remove" onclick="removePlanDay(${i})" aria-label="Видалити шаблон" title="Видалити шаблон">×</button></div></div>${p.e.length?`<div class="plan-exercise" style="padding:7px 0;color:var(--muted-2);font-size:9px;font-weight:800;letter-spacing:.6px"><span>ВПРАВА</span><span>ПІДХОДИ</span><span>ПОВТОРИ</span><span></span></div>${p.e.map((x,e)=>`<div class="plan-exercise"><span class="plan-exercise-name">${esc(x[0])}</span><input class="field" type="number" min="1" max="20" value="${esc(x[1])}" aria-label="Кількість підходів" onchange="editPlan(${i},${e},1,this.value)"><input class="field" type="text" value="${esc(x[2])}" aria-label="Повторення" onchange="editPlan(${i},${e},2,this.value)"><button class="remove-btn" onclick="removeExercise(${i},${e})" aria-label="Видалити вправу">×</button></div>`).join('')}`:'<div class="empty-state">У цьому тренуванні ще немає вправ. Додай їх із бібліотеки.</div>'}</section>`).join('');
return `<div class="page-heading"><div><div class="eyebrow">ПОВНИЙ КОНТРОЛЬ НАД РОЗКЛАДОМ</div><h1>Мій план</h1><p>Створи стільки тренувань, скільки потрібно саме тобі.</p></div><button class="btn btn-primary" onclick="addTrainingDay()">${icon('plus')} Нове тренування</button></div>${scheduleHtml}<div class="section-head plan-section-head"><div><h2>Шаблони тренувань</h2><p>Кожен шаблон має власні вправи, підходи та повторення.</p></div><span class="schedule-count">${P.length} шаблонів</span></div>${P.length?planHtml:'<div class="panel"><div class="empty-state"><strong>Програм ще немає</strong>Створи перше тренування кнопкою вище. Потім зможеш додати вправи та налаштувати розклад.</div></div>'}<div class="section-actions"><button class="btn btn-primary" onclick="navigate('today')">До тренування ${icon('arrow')}</button></div><div class="footer-note">Розклад автоматично оновлює календар і головний екран.</div>`;
}
function toggleScheduleDay(day){const m={...getScheduleMap()};if(Object.prototype.hasOwnProperty.call(m,day)){delete m[day];}else{const next=Object.keys(m).length%Math.max(1,P.length);m[day]=next;}S.schedule=m;save();draw();showToast('Розклад оновлено');}
function setScheduledWorkout(day,index){const m={...getScheduleMap()};if(!P[+index])return;m[day]=+index;S.schedule=m;save();draw();showToast('Тренування призначено');}
function addTrainingDay(){const name=prompt('Як назвати нове тренування?',`Тренування ${P.length+1}`);if(name===null)return;const n=name.trim().slice(0,42);if(!n){showToast('Введи назву тренування');return;}P.push({n,e:[]});save();draw();showToast('Новий шаблон створено — додай вправи');}
function renamePlanDay(i,name){const n=String(name||'').trim().slice(0,42);if(!n){draw();showToast('Назва не може бути порожньою');return;}P[i].n=n;save();draw();showToast('Назву оновлено');}
function removePlanDay(i){if(P.length<=1){showToast('Потрібен хоча б один шаблон');return;}const used=Object.values(S.logs).some(l=>+l.day===i);if(used){showToast('Цей шаблон є в історії. Замість видалення прибери його з розкладу.');return;}if(!confirm(`Видалити шаблон «${P[i].n}»?`))return;P.splice(i,1);const m={};for(const [d,v] of Object.entries(getScheduleMap())){if(+v===i)continue;m[d]=+v>i?+v-1:+v;}S.schedule=m;for(const l of Object.values(S.logs)){if(+l.day>i)l.day--;}selectedDay=null;save();draw();showToast('Шаблон видалено');}
function editPlan(i,e,k,v){if(k===1)P[i].e[e][k]=Math.max(1,Math.min(20,parseInt(v)||1));else P[i].e[e][k]=v.trim()||'8–12';save();showToast('План оновлено');}
function removeExercise(i,e){if(!confirm(`Прибрати вправу «${P[i].e[e][0]}» із плану?`))return;P[i].e.splice(e,1);save();draw();showToast('Вправу видалено з плану');}
function resetPlan(){if(!confirm('Очистити всі шаблони тренувань і розклад? Записи тренувань не видаляться.'))return;P=[];S.schedule={};S.plan=[];selectedDay=null;save();draw();showToast('Шаблони очищено');}
function openLibraryFor(day){libraryTarget=day;libraryQuery='';libraryGroup='Усі';navigate('library');}
function addLibraryExercise(index,day){const x=LIB[index];if(!x)return;P[day].e.push([x.n,3,'8–12']);save();showToast(`Додано в День ${day+1}`);navigate('plan');}
function renderLibrary(){const groups=['Усі','Спина','Груди','Плечі','Руки','Ноги','Прес'];const list=LIB.map((x,i)=>({...x,i})).filter(x=>(libraryGroup==='Усі'||x.g===libraryGroup)&&(!libraryQuery||`${x.n} ${x.p} ${x.g}`.toLowerCase().includes(libraryQuery.toLowerCase())));return `<div class="page-heading"><div><div class="eyebrow">РУХИ ТА ТЕХНІКА</div><h1>Бібліотека вправ</h1><p>Знайди потрібну вправу та додай її до свого плану.</p></div></div><div class="panel"><div class="section-head"><div><h2>Знайти вправу</h2><p>${LIB.length} вправ у бібліотеці</p></div></div><div class="search-box">${icon('search')}<input class="field" type="search" placeholder="Пошук за назвою або м’язами…" value="${esc(libraryQuery)}" oninput="searchLibrary(this.value)"></div><div class="filter-row" style="margin-top:12px">${groups.map(g=>`<button class="choice ${libraryGroup===g?'active':''}" onclick="filterLibrary('${g}')">${g}</button>`).join('')}</div><div class="form-field" style="margin-top:15px;max-width:260px"><label>ДОДАВАТИ ДО</label><select class="field" onchange="libraryTarget=+this.value">${P.map((p,i)=>`<option value="${i}" ${libraryTarget===i?'selected':''}>День ${i+1} · ${esc(p.n)}</option>`).join('')}</select></div></div><div class="library-grid" id="library-grid">${list.map(x=>`<article class="library-card"><span class="muscle-tag">${x.g}</span><h3>${esc(x.n)}</h3><p><strong>Для чого:</strong> ${esc(x.p)}</p><p><strong>Техніка:</strong> ${esc(x.t)}</p><div class="library-add"><button class="btn btn-secondary btn-small" onclick="addLibraryExercise(${x.i},libraryTarget)">${icon('plus')} Додати до плану</button></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Нічого не знайдено. Спробуй інший запит.</div>'}</div>`;}
function searchLibrary(v){libraryQuery=v;const root=document.getElementById('library-grid');if(!root)return;const list=LIB.map((x,i)=>({...x,i})).filter(x=>(libraryGroup==='Усі'||x.g===libraryGroup)&&(!libraryQuery||`${x.n} ${x.p} ${x.g}`.toLowerCase().includes(libraryQuery.toLowerCase())));root.innerHTML=list.map(x=>`<article class="library-card"><span class="muscle-tag">${x.g}</span><h3>${esc(x.n)}</h3><p><strong>Для чого:</strong> ${esc(x.p)}</p><p><strong>Техніка:</strong> ${esc(x.t)}</p><div class="library-add"><button class="btn btn-secondary btn-small" onclick="addLibraryExercise(${x.i},libraryTarget)">${icon('plus')} Додати до плану</button></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Нічого не знайдено. Спробуй інший запит.</div>';}
function filterLibrary(g){libraryGroup=g;draw();}
function videoSearchUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' правильна техніка виконання українською');}
function videoItems(){const all=[...LIB];for(const p of P)for(const x of p.e)if(!all.some(y=>y.n.toLowerCase()===x[0].toLowerCase()))all.push({n:x[0],g:'Мій план',p:'Вправа з твого плану',t:'Переглянь демонстрацію руху перед виконанням.'});return all.map((x,i)=>({...x,i})).filter(x=>(videoGroup==='Усі'||x.g===videoGroup)&&(!videoQuery||`${x.n} ${x.g} ${x.p}`.toLowerCase().includes(videoQuery.toLowerCase())));}
function renderVideoCards(){const items=videoItems(),root=document.getElementById('video-results');if(!root)return;root.innerHTML=items.map(x=>`<article class="video-card"><div class="video-thumb"><span class="video-play">${icon('youtube')}</span><span class="video-thumb-label">ТЕХНІКА ВИКОНАННЯ</span><span class="video-watermark">Престіж</span></div><div class="video-card-body"><span class="muscle-tag">${esc(x.g)}</span><h3>${esc(x.n)}</h3><p>${esc(x.t||x.p)}</p><a class="btn btn-youtube" href="${videoSearchUrl(x.n)}" target="_blank" rel="noopener noreferrer">${icon('youtube')} Відео на YouTube ${icon('arrow')}</a></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Не знайшов вправу. Спробуй іншу назву.</div>';}
function renderVideos(){const groups=['Усі','Спина','Груди','Плечі','Руки','Ноги','Прес','Мій план'];return `<div class="page-heading"><div><div class="eyebrow">ДИВИСЬ · ВЧИСЬ · ВИКОНУЙ</div><h1>Техніка вправ</h1><p>Шукай демонстрації рухів і дивись, як правильно виконувати вправи.</p></div></div><section class="video-hero"><div><span class="video-hero-kicker">Престіж VIDEO GUIDE</span><h2>Спочатку техніка.<br><em>Потім вага.</em></h2><p>Обери вправу — відкриється актуальна добірка відео на YouTube за її назвою.</p></div><div class="video-hero-mark">▶</div></section><section class="panel"><div class="section-head"><div><h2>Знайти демонстрацію</h2><p>${videoItems().length} вправ доступні для пошуку відео.</p></div></div><div class="search-box">${icon('search')}<input class="field" type="search" placeholder="Наприклад, жим лежачи…" value="${esc(videoQuery)}" oninput="videoQuery=this.value;renderVideoCards()"></div><div class="filter-row" style="margin-top:12px">${groups.map(g=>`<button class="choice ${videoGroup===g?'active':''}" onclick="videoGroup='${g}';draw()">${g}</button>`).join('')}</div></section><div class="video-grid" id="video-results">${videoItems().map(x=>`<article class="video-card"><div class="video-thumb"><span class="video-play">${icon('youtube')}</span><span class="video-thumb-label">ТЕХНІКА ВИКОНАННЯ</span><span class="video-watermark">Престіж</span></div><div class="video-card-body"><span class="muscle-tag">${esc(x.g)}</span><h3>${esc(x.n)}</h3><p>${esc(x.t||x.p)}</p><a class="btn btn-youtube" href="${videoSearchUrl(x.n)}" target="_blank" rel="noopener noreferrer">${icon('youtube')} Відео на YouTube ${icon('arrow')}</a></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Не знайшов вправу. Спробуй іншу назву.</div>'}</div><div class="notice">Посилання відкривають пошук YouTube, а не випадкове застаріле відео. Так ти бачиш актуальні демонстрації та можеш вибрати тренера, мову й формат пояснення.</div><div class="footer-note">Відео надає YouTube. Престіж не зберігає та не завантажує чужі ролики.</div>`;}
function todayFood(){if(!S.foodLogs[foodDate])S.foodLogs[foodDate]={meals:[]};const x=S.foodLogs[foodDate];if(!Array.isArray(x.meals))x.meals=[];return x;}
function setFoodDate(value){if(!value)return;foodDate=value>todayISO()?todayISO():value;draw();}
function shiftFoodDate(delta){const d=parseISO(foodDate);d.setDate(d.getDate()+delta);const v=iso(d);if(v<=todayISO()){foodDate=v;draw();}}
function foodTotals(log){return (log.meals||[]).reduce((a,m)=>{const n=+m.portions||1;a.kcal+=(+m.kcal||0)*n;a.p+=(+m.p||0)*n;a.c+=(+m.c||0)*n;a.f+=(+m.f||0)*n;return a;},{kcal:0,p:0,c:0,f:0});}
function renderNutrition(){const log=todayFood(),t=foodTotals(log),goal=S.nutritionGoal,ratio=goal?Math.min(100,t.kcal/goal*100):0,types=['Сніданок','Обід','Вечеря','Перекус'],water=waterForDate(),waterGoal=+S.waterGoal||2000;return `<div class="page-heading food-heading"><div><div class="eyebrow">ЇЖА ТА ВІДНОВЛЕННЯ</div><h1>Харчування</h1><p>Записуй прийоми їжі та дивись добову суму.</p></div><div class="food-date-picker"><button class="date-shift" onclick="shiftFoodDate(-1)" aria-label="Попередній день">‹</button><input class="field" type="date" value="${foodDate}" max="${todayISO()}" onchange="setFoodDate(this.value)"><button class="date-shift" onclick="shiftFoodDate(1)" aria-label="Наступний день" ${foodDate>=todayISO()?'disabled':''}>›</button></div></div><section class="nutrition-summary"><div class="nutrition-main"><span class="nutrition-overline">ЗА СЬОГОДНІ</span><div class="nutrition-calories">${Math.round(t.kcal)} <small>ккал</small></div><div class="nutrition-goal-line">${goal?`із ${goal.toLocaleString('uk-UA')} ккал`: 'добову ціль не задано'}</div><div class="nutrition-track"><i style="width:${ratio}%"></i></div></div><div class="macro-grid"><div><span>БІЛКИ</span><strong>${t.p.toFixed(1)}<small> г</small></strong></div><div><span>ВУГЛЕВОДИ</span><strong>${t.c.toFixed(1)}<small> г</small></strong></div><div><span>ЖИРИ</span><strong>${t.f.toFixed(1)}<small> г</small></strong></div></div></section><section class="panel water-panel"><div class="water-head"><div><div class="eyebrow">МАЛЕНЬКА ЗВИЧКА</div><h2>Вода</h2><p>Відмічай випиті склянки протягом дня.</p></div><div class="water-total">${(water/1000).toFixed(2)} <small>л</small></div></div><div class="water-track"><i style="width:${Math.min(100,water/waterGoal*100)}%"></i></div><div class="water-caption">${water.toLocaleString('uk-UA')} з ${waterGoal.toLocaleString('uk-UA')} мл · ${Math.round(water/waterGoal*100)}%</div><div class="water-actions"><button class="btn btn-secondary" onclick="addWater(200)">+ 200 мл</button><button class="btn btn-secondary" onclick="addWater(300)">+ 300 мл</button><button class="btn btn-ghost" onclick="addWater(-200)">− 200 мл</button></div><div class="water-goal-edit"><label for="water-goal">Моя ціль, мл</label><input class="field" id="water-goal" type="number" min="250" max="6000" step="50" value="${waterGoal}"><button class="btn btn-small btn-secondary" onclick="saveWaterGoal()">Зберегти</button></div></section><section class="panel"><div class="section-head"><div><h2>Добова ціль</h2><p>Необов’язково. Можеш просто вести журнал без ліміту.</p></div></div><div class="goal-editor"><input class="field" id="nutrition-goal" type="number" min="1" max="10000" placeholder="Ккал на день" value="${goal||''}"><button class="btn btn-secondary" onclick="saveNutritionGoal()">Зберегти ціль</button><button class="btn btn-ghost" onclick="clearNutritionGoal()">Без цілі</button></div></section><section class="panel"><div class="section-head"><div><h2>Додати їжу</h2><p>Внось значення з упаковки або зваженої порції.</p></div></div><div class="form-grid nutrition-form"><div class="form-field full"><label>НАЗВА ПРОДУКТУ / СТРАВИ</label><input class="field" id="meal-name" maxlength="70" placeholder="Наприклад, вівсянка з молоком"></div><div class="form-field"><label>ПРИЙОМ ЇЖІ</label><select class="field" id="meal-type">${types.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>КІЛЬКІСТЬ ПОРЦІЙ</label><input class="field" type="number" id="meal-portions" min="0.1" max="20" step="0.1" value="1"></div><div class="form-field"><label>КАЛОРІЇ НА ПОРЦІЮ</label><input class="field" type="number" id="meal-kcal" min="0" max="5000" placeholder="ккал"></div><div class="form-field"><label>БІЛКИ, Г</label><input class="field" type="number" id="meal-p" min="0" max="300" step="0.1" placeholder="г"></div><div class="form-field"><label>ВУГЛЕВОДИ, Г</label><input class="field" type="number" id="meal-c" min="0" max="500" step="0.1" placeholder="г"></div><div class="form-field"><label>ЖИРИ, Г</label><input class="field" type="number" id="meal-f" min="0" max="300" step="0.1" placeholder="г"></div><div class="form-field full"><button class="btn btn-primary" onclick="addMeal()">${icon('plus')} Додати до щоденника</button></div></div></section><section class="panel"><div class="section-head"><div><h2>Щоденник за день</h2><p>${log.meals.length} записів · суми рахуються автоматично.</p></div><strong class="meal-total">${Math.round(t.kcal)} ккал</strong></div>${log.meals.length?types.map(type=>{const items=log.meals.filter(m=>m.type===type);return items.length?`<div class="meal-group"><h3>${type}</h3>${items.map(m=>`<div class="meal-row"><div class="meal-info"><strong>${esc(m.name)}</strong><small>${m.portions} порц. · Б ${(+m.p||0)*m.portions} г · В ${(+m.c||0)*m.portions} г · Ж ${(+m.f||0)*m.portions} г</small></div><div class="meal-kcal">${Math.round(m.kcal*m.portions)} <small>ккал</small></div><button class="remove-btn" onclick="removeMeal(${m.id})" aria-label="Видалити запис">×</button></div>`).join('')}</div>`:''}).join(''):'<div class="empty-state">Тут поки порожньо. Додай перший прийом їжі.</div>'}</section><div class="notice"><strong>Важливо:</strong> калорії — лише орієнтир, а не оцінка того, наскільки добре ти харчуєшся. Під час росту не використовуй трекер для жорсткого обмеження їжі; добову ціль за потреби краще узгодити з лікарем або дієтологом.</div><div class="footer-note">Журнал зберігається приватно в цьому браузері.</div>`;}
function addMeal(){const name=document.getElementById('meal-name').value.trim(),kcal=+document.getElementById('meal-kcal').value,p=+document.getElementById('meal-p').value||0,c=+document.getElementById('meal-c').value||0,f=+document.getElementById('meal-f').value||0,portions=+document.getElementById('meal-portions').value||1,type=document.getElementById('meal-type').value;if(!name||document.getElementById('meal-kcal').value===''||kcal<0||portions<=0){showToast('Вкажи назву, калорії та кількість порцій');return;}const log=todayFood();log.meals.push({id:Date.now()+Math.floor(Math.random()*1000),name,kcal,p,c,f,portions,type});save();draw();showToast('Запис додано до щоденника');}
function removeMeal(id){const log=todayFood();log.meals=log.meals.filter(x=>x.id!==id);save();draw();showToast('Запис видалено');}
function saveNutritionGoal(){const x=+document.getElementById('nutrition-goal').value;if(!x||x<1||x>10000){showToast('Введи коректну ціль у ккал');return;}S.nutritionGoal=Math.round(x);save();draw();showToast('Добову ціль збережено');}
function clearNutritionGoal(){S.nutritionGoal=null;save();draw();showToast('Облік без добової цілі');}
function personalRecords(){const m={};for(const l of Object.values(S.logs)){for(const [ei,sets] of Object.entries(l.sets||{})){(sets||[]).forEach(s=>{if(s?.ok&&+s.w>0&&+s.r>0){const name=s.n||P[l.day]?.e?.[+ei]?.[0]||'Вправа';const e=estimate1RM(s.w,s.r);if(!m[name]||e>m[name].e)m[name]={e,w:s.w,r:s.r};}});}}return m;}
function estimate1RM(w,r){w=+w;r=+r;if(!w||!r)return 0;return r===1?w:w*(1+r/30);}
function chartMarkup(data,title,unit,key){if(data.length<2)return `<div class="chart-empty">Додай ще ${2-data.length} ${data.length===0?'заміри':'заміри'} — тут з’явиться графік.</div>`;const W=620,H=190,L=34,R=18,T=18,B=35,vals=data.map(x=>+x[key]).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const pts=data.map((d,i)=>({x:L+i*(W-L-R)/(data.length-1),y:T+(max-(+d[key]))/range*(H-T-B),v:+d[key],label:fmtDate(d.d,{day:'numeric',month:'short'})}));const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');const area=path+` L ${pts[pts.length-1].x} ${H-B} L ${pts[0].x} ${H-B} Z`;const grid=[0,1,2,3].map(i=>{const y=T+i*(H-T-B)/3;return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted-2)">${(max-i*range/3).toFixed(1)}</text>`}).join('');return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${grid}<path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${p.label}: ${p.v} ${unit}</title></circle>${(i===0||i===pts.length-1||i===Math.floor(pts.length/2))?`<text x="${p.x}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted-2)">${p.label}</text>`:''}`).join('')}</svg><div class="chart-legend"><span><i class="legend-dot" style="background:var(--accent)"></i>${title}, ${unit}</span><span>Останнє значення: <strong style="color:var(--text)">${vals[vals.length-1]} ${unit}</strong></span></div></div>`;}
function weeklyVolumes(){const out=[];const d=parseISO(todayISO());d.setDate(d.getDate()-((d.getDay()+6)%7)-49);for(let w=0;w<8;w++){let v=0,c=0;for(let j=0;j<7;j++){const s=iso(d),l=S.logs[s];if(l){if(l.done)c++;for(const sets of Object.values(l.sets||{}))(sets||[]).forEach(x=>{if(x?.ok)v+=(+x.w||0)*(+x.r||0);});}d.setDate(d.getDate()+1);}out.push({v,c});}return out;}
function volumeChart(){const data=weeklyVolumes(),max=Math.max(1,...data.map(x=>x.v));return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 620 190" role="img" aria-label="Тоннаж за останні вісім тижнів">${data.map((x,i)=>{const barH=x.v/max*112,xx=25+i*75;return `<rect x="${xx}" y="${137-barH}" width="40" height="${barH}" rx="7" fill="var(--accent)" opacity="${.45+i*.07}"/><text x="${xx+20}" y="${Math.max(17,130-barH)}" text-anchor="middle" font-size="10" fill="var(--text)">${x.v?Math.round(x.v/100)/10+'т':'—'}</text><text x="${xx+20}" y="157" text-anchor="middle" font-size="10" fill="var(--muted-2)">${i+1}</text><text x="${xx+20}" y="174" text-anchor="middle" font-size="9" fill="var(--muted-2)">${x.c}/${scheduledCount()}</text>`}).join('')}</svg><div class="chart-legend"><span>Останні 8 тижнів: тоннаж та кількість завершених тренувань.</span></div></div>`;}
function renderCalendar(){const first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,days=new Date(calendarYear,calendarMonth+1,0).getDate();let html=`<div class="month-head"><strong>${MONTHS[calendarMonth]} ${calendarYear}</strong><div class="month-arrows"><button onclick="moveMonth(-1)" aria-label="Попередній місяць">‹</button><button onclick="moveMonth(1)" aria-label="Наступний місяць">›</button></div></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}`;for(let i=0;i<offset;i++)html+='<div class="calendar-day empty"></div>';for(let d=1;d<=days;d++){const date=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,planned=P.length>0&&schedule(date)!==undefined,past=date<todayISO()&&date>=S.start,state=S.logs[date]?.done?'completed':(planned&&past?'missed':planned?'scheduled':''),today=date===todayISO(),future=date>todayISO(),hint=state==='completed'?'Виконано: тренування відмічене як завершене':state==='missed'?'Пропущено: на цей день було призначене тренування, дата вже минула, а відмітки про виконання немає':state==='scheduled'?'Заплановане тренування':'День без запланованого тренування';html+=`<button class="calendar-day ${state} ${today?'today':''} ${future?'future':''}" ${future?'disabled':`onclick="toggleCalendarDay('${date}')"`} title="${date} — ${hint}" aria-label="${date}. ${hint}">${d}<small>${state==='completed'?'✓':state==='missed'?'×':state==='scheduled'?'•':''}</small></button>`;}return html+'</div>';}
function moveMonth(delta){calendarMonth+=delta;if(calendarMonth<0){calendarMonth=11;calendarYear--;}if(calendarMonth>11){calendarMonth=0;calendarYear++;}const el=document.getElementById('calendar');if(el)el.innerHTML=renderCalendar();}
function toggleCalendarDay(date){const l=S.logs[date];if(l?.done){if(!confirm('Зняти відмітку про тренування за цей день?'))return;S.logs[date].done=false;}else{S.logs[date]={day:schedule(date)??0,sets:l?.sets||{},done:true};}save();draw();}
function renderProgress(){const sorted=S.body.slice().sort((a,b)=>a.d.localeCompare(b.d)),latest=sorted[sorted.length-1]||{},prs=personalRecords(),prKeys=Object.keys(prs).sort((a,b)=>prs[b].e-prs[a].e).slice(0,8),n=doneDates().length;const achievements=[['🏁','Перше тренування','Зроби перший запис',n>=1],['🔟','10 тренувань','Тримай регулярність',n>=10],['💯','25 тренувань','Стабільна робота',n>=25],['🔥','Серія 7 днів','Сім тренувальних днів',streak()>=7],['🏋️','10 тонн','Загальний тоннаж',totalVolume()>=10000],['📏','−2 см талії','Зміна замірів',sorted.filter(x=>x.t!=null).length>1&&Math.max(...sorted.filter(x=>x.t!=null).map(x=>x.t))-Math.min(...sorted.filter(x=>x.t!=null).map(x=>x.t))>=2]];return `<div class="page-heading"><div><div class="eyebrow">ЦИФРИ, ЯКІ ПОКАЗУЮТЬ РОБОТУ</div><h1>Твій прогрес</h1><p>Відстежуй динаміку, а не лише цифру на вагах.</p></div></div><div class="two-col"><section class="panel"><div class="section-head"><div><h2>Заміри тіла та сили</h2><p>Додавай новий запис, коли хочеш відстежити зміни.</p></div></div><div class="form-grid"><div class="form-field"><label>Вага, кг</label><input class="field" id="body-weight" type="number" step="0.1" inputmode="decimal" placeholder="Наприклад, 75" value="${latest.w??''}"></div><div class="form-field"><label>Талія, см</label><input class="field" id="body-waist" type="number" step="0.1" inputmode="decimal" placeholder="Наприклад, 78" value="${latest.t??''}"></div><div class="form-field full"><label>Жим лежачи, кг · робоча вага</label><input class="field" id="body-bench" type="number" step="0.5" inputmode="decimal" placeholder="Наприклад, 40" value="${latest.b??''}"></div><div class="form-field full"><button class="btn btn-primary" onclick="saveBody()">${icon('check')} Зберегти заміри</button></div></div></section><section class="panel"><div class="section-head"><div><h2>Загальна статистика</h2><p>Усе зафіксоване в Престіж.</p></div></div><div class="three-col" style="grid-template-columns:1fr 1fr"><div class="mini-stat"><span>Тренування</span><strong>${n}</strong></div><div class="mini-stat"><span>Тоннаж</span><strong>${(totalVolume()/1000).toFixed(1)} т</strong></div><div class="mini-stat"><span>Серія</span><strong>${streak()} дн.</strong></div><div class="mini-stat"><span>Цього тижня</span><strong>${weeklyCount()}/${scheduledCount()}</strong></div></div></section></div>
<div class="two-col"><section class="panel"><div class="section-head"><div><h2>Динаміка ваги</h2><p>За всіма збереженими замірами.</p></div></div>${chartMarkup(sorted.filter(x=>x.w!=null),'Вага','кг','w')}</section><section class="panel"><div class="section-head"><div><h2>Динаміка талії</h2><p>Заміри в сантиметрах.</p></div></div>${chartMarkup(sorted.filter(x=>x.t!=null),'Талія','см','t')}</section></div>
<section class="panel"><div class="section-head"><div><h2>Тоннаж за тижнями</h2><p>Обсяг виконаної роботи за останні 8 тижнів.</p></div></div>${volumeChart()}</section>
<div class="two-col"><section class="panel"><div class="section-head"><div><h2>Особисті рекорди</h2><p>Орієнтовний максимум на одне повторення (1ПМ).</p></div></div>${prKeys.length?`<div class="table-scroll"><table class="history-table"><thead><tr><th>Вправа</th><th>Найкращий підхід</th><th>1ПМ</th></tr></thead><tbody>${prKeys.map(k=>`<tr><td><strong>${esc(k)}</strong></td><td>${esc(prs[k].w)} × ${esc(prs[k].r)}</td><td><strong>${prs[k].e.toFixed(1)} кг</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Поки немає записів.<br>Відміть виконаний підхід — рекорди з’являться тут.</div>'}</section><section class="panel"><div class="section-head"><div><h2>Досягнення</h2><p>Маленькі кроки складаються у великий результат.</p></div></div><div class="achievement-grid">${achievements.map(a=>`<div class="achievement ${a[3]?'unlocked':''}"><span class="achievement-icon">${a[0]}</span><div><strong>${a[1]}</strong><small>${a[2]}</small></div></div>`).join('')}</div></section></div>
<section class="panel"><div class="section-head"><div><h2>Календар тренувань</h2><p>Натисни на минулу дату, щоб змінити відмітку.</p></div></div><div id="calendar">${renderCalendar()}</div><div class="chart-legend"><span><i class="legend-dot" style="background:var(--green)"></i>Виконано</span><span><i class="legend-dot" style="background:var(--red)"></i>Пропущено за планом</span><span><i class="legend-dot" style="background:var(--accent)"></i>Сьогодні</span></div><div class="notice" style="margin-top:12px">День стає «Пропущено» автоматично, якщо на нього призначене тренування в розкладі, дата вже минула, день не раніше початку журналу, а тренування не позначене як виконане. Дні відпочинку та дні без призначеного тренування не вважаються пропущеними. Натисни на минулий день у календарі, щоб вручну відмітити виконання або скасувати відмітку.</div></section>
${sorted.length?`<section class="panel"><div class="section-head"><div><h2>Історія замірів</h2><p>${sorted.length} записів збережено.</p></div><button class="btn btn-ghost btn-small" onclick="clearBody()">Очистити історію</button></div><div class="table-scroll"><table class="history-table"><thead><tr><th>Дата</th><th>Вага</th><th>Талія</th><th>Жим</th><th></th></tr></thead><tbody>${sorted.slice().reverse().map(x=>`<tr><td><strong>${fmtDate(x.d,{day:'numeric',month:'short',year:'numeric'})}</strong></td><td>${x.w??'—'} кг</td><td>${x.t??'—'} см</td><td>${x.b??'—'} кг</td><td><button class="remove-btn" onclick="deleteBody('${x.d}')" title="Видалити запис">×</button></td></tr>`).join('')}</tbody></table></div></section>`:''}<div class="footer-note">Результат — це послідовність, а не один день.</div>`;}
function saveBody(){const w=document.getElementById('body-weight').value,t=document.getElementById('body-waist').value,b=document.getElementById('body-bench').value;if(!w&&!t&&!b){showToast('Введи хоча б один показник');return;}const d=todayISO();S.body=S.body.filter(x=>x.d!==d);S.body.push({d,w:w===''?null:+w,t:t===''?null:+t,b:b===''?null:+b});S.body.sort((a,b)=>a.d.localeCompare(b.d));save();draw();showToast('Заміри збережено');}

<section class="panel"><div class="section-head"><div><h2>Калькулятори</h2><p>Допоміжні інструменти для тренування.</p></div></div><div class="two-col"><div><div class="form-field"><label>РОЗРАХУНОК 1ПМ · ВАГА, КГ</label><input class="field" type="number" id="calc-weight" step="0.5" placeholder="Наприклад, 50"></div><div class="form-field" style="margin-top:9px"><label>ПОВТОРЕННЯ</label><input class="field" type="number" id="calc-reps" min="1" max="20" placeholder="Наприклад, 8"></div><button class="btn btn-secondary" style="margin-top:10px" onclick="calculate1RM()">Порахувати 1ПМ</button><div id="calc-result" class="tipline" style="margin-top:9px"></div></div><div><div class="form-field"><label>ЦІЛЬОВА ВАГА НА ГРИФІ, КГ</label><input class="field" type="number" id="plate-total" step="0.5" placeholder="Наприклад, 60"></div><div class="form-field" style="margin-top:9px"><label>ВАГА ГРИФА, КГ</label><input class="field" type="number" id="plate-bar" value="20" step="0.5"></div><button class="btn btn-secondary" style="margin-top:10px" onclick="calculatePlates()">Підібрати диски</button><div id="plate-result" class="tipline" style="margin-top:9px"></div></div></div></section>
<section class="panel"><div class="section-head"><div><h2>Резервна копія</h2><p>Експортуй дані перед зміною браузера або пристрою.</p></div></div><div class="section-actions"><button class="btn btn-primary" onclick="exportData()">${icon('download')} Експортувати дані</button><label class="btn btn-secondary" for="import-file" style="cursor:pointer">${icon('upload')} Імпортувати дані</label><input id="import-file" type="file" accept="application/json,.json" hidden onchange="importData(this)"></div><div class="notice" style="margin-top:14px">Усі тренування, заміри, профіль та налаштування зберігаються локально в цьому браузері. Для перенесення використовуй резервну копію.</div></section>
<section class="panel"><div class="section-head"><div><h2>Керування даними</h2><p>Ці дії не можна скасувати.</p></div></div><div class="section-actions"><button class="btn btn-ghost" onclick="clearLogs()">Очистити журнал тренувань</button><button class="btn btn-ghost" onclick="clearBody()">Очистити заміри</button><button class="btn btn-danger" onclick="wipeAll()">${icon('trash')} Видалити всі дані</button></div></section>
<div class="footer-note">Престіж · Версія 4.0 · Твій зал, твій план</div>`;}
function calculate1RM(){const w=+document.getElementById('calc-weight').value,r=+document.getElementById('calc-reps').value,el=document.getElementById('calc-result');if(!w||!r||r<1||r>20){el.textContent='Введи вагу та від 1 до 20 повторень.';return;}el.innerHTML=`Орієнтовний 1ПМ: <strong style="color:var(--accent)">${estimate1RM(w,r).toFixed(1)} кг</strong>`;}
function calculatePlates(){const t=+document.getElementById('plate-total').value,b=+document.getElementById('plate-bar').value||20,el=document.getElementById('plate-result');if(!t||t<b){el.textContent='Загальна вага має бути не меншою за вагу грифа.';return;}let rem=(t-b)/2;const plates=[25,20,15,10,5,2.5,1.25],out=[];for(const p of plates){const n=Math.floor((rem+1e-8)/p);if(n){out.push(`${n} × ${p} кг`);rem-=n*p;}}el.innerHTML=`На кожен бік: <strong style="color:var(--accent)">${out.join(' + ')||'без дисків'}</strong>${rem>.01?`<br><small>Не вдалося набрати ще ${rem.toFixed(2)} кг на бік стандартними дисками.</small>`:''}`;}
function exportData(){const blob=new Blob([JSON.stringify({...S,plan:P},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ironlog-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('Резервну копію створено');}
function importData(input){const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.logs!=='object'||!Array.isArray(o.body))throw new Error('invalid');if(!confirm('Замінити поточні дані інформацією з резервної копії?'))return;S={...loadState(),...o,account:{name:'',goal:'',...(o.account||{})},language:['uk','en','pl'].includes(o.language)?o.language:'uk',waterLogs:o.waterLogs&&typeof o.waterLogs==='object'?o.waterLogs:{},waterGoal:Number.isFinite(+o.waterGoal)&&+o.waterGoal>0?+o.waterGoal:2000};if(Array.isArray(o.plan))P=o.plan;save();draw();showToast('Дані успішно імпортовано');}catch(e){showToast('Файл резервної копії некоректний');}finally{input.value='';}};r.readAsText(file);}
function clearLogs(){if(!confirm('Очистити всі записи тренувань? План і заміри залишаться.'))return;S.logs={};S.start=todayISO();save();draw();showToast('Журнал тренувань очищено');}
function wipeAll(){if(prompt('Це видалить усі тренування, заміри, план і налаштування. Введи ВИДАЛИТИ для підтвердження:')!=='ВИДАЛИТИ')return;try{localStorage.removeItem(STORE_KEY);}catch(e){}location.reload();}
function startTimer(seconds){timerEnd=Date.now()+seconds*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerUI,250);updateTimerUI();}
function updateTimerUI(){const bar=document.getElementById('timer-bar');if(!bar)return;if(!timerEnd){bar.classList.remove('visible');return;}const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(left<=0){stopTimer();showToast('Час наступного підходу!');try{navigator.vibrate?.([180,100,180]);}catch(e){}return;}document.getElementById('timer-value').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.classList.add('visible');}
function adjustTimer(delta){if(!timerEnd)return;timerEnd=Math.max(Date.now()+1000,timerEnd+delta*1000);updateTimerUI();}
function stopTimer(){timerEnd=0;if(timerInterval){clearInterval(timerInterval);timerInterval=null;}updateTimerUI();}


document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.language==='en'?'en':S.language==='pl'?'pl':'uk';document.getElementById('theme-toggle').addEventListener('click',()=>setTheme(S.theme==='dark'?'light':'dark'));

draw();
</script>
