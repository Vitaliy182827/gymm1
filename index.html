<title>IRONLOG — тренування та прогрес</title>
<style>

.content{width:min(100%,var(--content));padding:34px clamp(22px,4vw,58px) 90px;margin:0 auto}.view-enter{animation:viewIn .42s cubic-bezier(.2,.75,.25,1) both}@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 25px}.eyebrow{color:var(--accent);font-size:10px;font-weight:850;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:7px}.page-heading h1{font-size:clamp(27px,3vw,36px);letter-spacing:-1.4px;line-height:1.1;margin:0;font-weight:850}.page-heading p{margin:8px 0 0;color:var(--muted);font-size:13px}.heading-date{white-space:nowrap;color:var(--muted);font-size:12px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}

.set-labels,.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}.set-labels{padding:0 3px 6px;color:var(--muted-2);font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.set-row{margin:5px 0}.set-num{display:grid;place-items:center;width:29px;height:34px;color:var(--muted);font-size:11px;font-weight:750}.field{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);padding:10px 11px;outline:none;transition:border-color .18s,background .18s,box-shadow .18s;font-variant-numeric:tabular-nums}.field::placeholder{color:var(--muted-2)}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.set-field{text-align:center;padding:9px 8px}.check-set{width:46px;height:39px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;transition:all .2s}.check-set svg{width:18px;height:18px}.check-set:hover{border-color:var(--accent);color:var(--accent)}.check-set.checked{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:checkPop .25s ease-out}@keyframes checkPop{50%{transform:scale(1.1)}}.exercise-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.muted-link{background:none;border:0;color:var(--muted);font-size:11px;padding:5px 0}.muted-link:hover{color:var(--accent)}.workout-note{margin-top:16px}.workout-note textarea{min-height:68px;resize:vertical}.finish-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.finish-row .btn{min-width:220px}.finish-hint{font-size:11px;color:var(--muted)}

const map=getScheduleMap(),days=[{d:1,n:'Пн'},{d:2,n:'Вт'},{d:3,n:'Ср'},{d:4,n:'Чт'},{d:5,n:'Пт'},{d:6,n:'Сб'},{d:0,n:'Нд'}];
const scheduled=days.filter(x=>Object.prototype.hasOwnProperty.call(map,x.d));
const scheduleHtml=`<section class="panel schedule-panel"><div class="section-head"><div><h2>Твій тижневий розклад</h2><p>Обирай будь-які дні. Кількість тренувань рахується автоматично.</p></div><span class="schedule-count">${scheduled.length} / 7 днів</span></div><div class="week-schedule">${days.map(x=>`<button class="schedule-day ${Object.prototype.hasOwnProperty.call(map,x.d)?'selected':''}" onclick="toggleScheduleDay(${x.d})"><span>${x.n}</span><i>${Object.prototype.hasOwnProperty.call(map,x.d)?'✓':'+'}</i></button>`).join('')}</div><div class="schedule-assignments">${scheduled.length?scheduled.map(x=>`<label class="schedule-assignment"><span><strong>${weekDayLabel(x.d)}</strong><small>Яке тренування виконувати</small></span><select class="field" onchange="setScheduledWorkout(${x.d},this.value)">${P.map((p,i)=>`<option value="${i}" ${+map[x.d]===i?'selected':''}>${i+1}. ${esc(p.n)}</option>`).join('')}</select></label>`).join(''):'<div class="empty-state">Поки немає тренувальних днів. Натисни «+» на будь-якому дні тижня.</div>'}</div><div class="notice" style="margin-top:14px">Дні відпочинку не рахуються як пропущені. Один шаблон можна призначити кільком дням або створити окремі програми.</div></section>`;
const planHtml=P.map((p,i)=>`<section class="panel plan-day"><div class="plan-day-head"><div style="flex:1;min-width:0"><div class="plan-day-title">Тренування ${i+1}</div><input class="field plan-name-field" type="text" maxlength="42" value="${esc(p.n)}" aria-label="Назва тренування" onchange="renamePlanDay(${i},this.value)"><div class="plan-day-sub">${p.e.length} вправ · ${p.e.reduce((a,x)=>a+(+x[1]||0),0)} підходів</div></div><div class="plan-actions"><button class="btn btn-secondary btn-small" onclick="openLibraryFor(${i})">${icon('plus')} Вправи</button><button class="remove-btn plan-remove" onclick="removePlanDay(${i})" aria-label="Видалити шаблон" title="Видалити шаблон">×</button></div></div>${p.e.length?`<div class="plan-exercise" style="padding:7px 0;color:var(--muted-2);font-size:9px;font-weight:800;letter-spacing:.6px"><span>ВПРАВА</span><span>ПІДХОДИ</span><span>ПОВТОРИ</span><span></span></div>${p.e.map((x,e)=>`<div class="plan-exercise"><span class="plan-exercise-name">${esc(x[0])}</span><input class="field" type="number" min="1" max="20" value="${esc(x[1])}" aria-label="Кількість підходів" onchange="editPlan(${i},${e},1,this.value)"><input class="field" type="text" value="${esc(x[2])}" aria-label="Повторення" onchange="editPlan(${i},${e},2,this.value)"><button class="remove-btn" onclick="removeExercise(${i},${e})" aria-label="Видалити вправу">×</button></div>`).join('')}`:'<div class="empty-state">У цьому тренуванні ще немає вправ. Додай їх із бібліотеки.</div>'}</section>`).join('');
return `<div class="page-heading"><div><div class="eyebrow">ПОВНИЙ КОНТРОЛЬ НАД РОЗКЛАДОМ</div><h1>Мій план</h1><p>Створи стільки тренувань, скільки потрібно саме тобі.</p></div><button class="btn btn-primary" onclick="addTrainingDay()">${icon('plus')} Нове тренування</button></div>${scheduleHtml}<div class="section-head plan-section-head"><div><h2>Шаблони тренувань</h2><p>Кожен шаблон має власні вправи, підходи та повторення.</p></div><span class="schedule-count">${P.length} шаблонів</span></div>${planHtml}<div class="section-actions"><button class="btn btn-secondary" onclick="resetPlan()">${icon('upload')} Відновити стартовий план</button><button class="btn btn-primary" onclick="navigate('today')">До тренування ${icon('arrow')}</button></div><div class="footer-note">Розклад автоматично оновлює календар і головний екран.</div>`;
}
function toggleScheduleDay(day){const m={...getScheduleMap()};if(Object.prototype.hasOwnProperty.call(m,day)){delete m[day];}else{const next=Object.keys(m).length%Math.max(1,P.length);m[day]=next;}S.schedule=m;save();draw();showToast('Розклад оновлено');}
function setScheduledWorkout(day,index){const m={...getScheduleMap()};if(!P[+index])return;m[day]=+index;S.schedule=m;save();draw();showToast('Тренування призначено');}
function addTrainingDay(){const name=prompt('Як назвати нове тренування?',`Тренування ${P.length+1}`);if(name===null)return;const n=name.trim().slice(0,42);if(!n){showToast('Введи назву тренування');return;}P.push({n,e:[]});save();draw();showToast('Новий шаблон створено — додай вправи');}
function renamePlanDay(i,name){const n=String(name||'').trim().slice(0,42);if(!n){draw();showToast('Назва не може бути порожньою');return;}P[i].n=n;save();draw();showToast('Назву оновлено');}
function removePlanDay(i){if(P.length<=1){showToast('Потрібен хоча б один шаблон');return;}const used=Object.values(S.logs).some(l=>+l.day===i);if(used){showToast('Цей шаблон є в історії. Замість видалення прибери його з розкладу.');return;}if(!confirm(`Видалити шаблон «${P[i].n}»?`))return;P.splice(i,1);const m={};for(const [d,v] of Object.entries(getScheduleMap())){if(+v===i)continue;m[d]=+v>i?+v-1:+v;}S.schedule=m;for(const l of Object.values(S.logs)){if(+l.day>i)l.day--;}selectedDay=null;save();draw();showToast('Шаблон видалено');}
function editPlan(i,e,k,v){if(k===1)P[i].e[e][k]=Math.max(1,Math.min(20,parseInt(v)||1));else P[i].e[e][k]=v.trim()||'8–12';save();showToast('План оновлено');}
function removeExercise(i,e){if(!confirm(`Прибрати вправу «${P[i].e[e][0]}» із плану?`))return;P[i].e.splice(e,1);save();draw();showToast('Вправу видалено з плану');}
function resetPlan(){if(!confirm('Відновити початковий план і розклад Пн / Ср / Пт? Твої записи тренувань не видаляться.'))return;P=deep(DEFAULT_PLAN);S.schedule=null;S.plan=deep(P);selectedDay=null;save();draw();showToast('Початковий план відновлено');}
function openLibraryFor(day){libraryTarget=day;libraryQuery='';libraryGroup='Усі';navigate('library');}
function addLibraryExercise(index,day){const x=LIB[index];if(!x)return;P[day].e.push([x.n,3,'8–12']);save();showToast(`Додано в День ${day+1}`);navigate('plan');}
function renderLibrary(){const groups=['Усі','Спина','Груди','Плечі','Руки','Ноги','Прес'];const list=LIB.map((x,i)=>({...x,i})).filter(x=>(libraryGroup==='Усі'||x.g===libraryGroup)&&(!libraryQuery||`${x.n} ${x.p} ${x.g}`.toLowerCase().includes(libraryQuery.toLowerCase())));return `<div class="page-heading"><div><div class="eyebrow">РУХИ ТА ТЕХНІКА</div><h1>Бібліотека вправ</h1><p>Знайди потрібну вправу та додай її до свого плану.</p></div></div><div class="panel"><div class="section-head"><div><h2>Знайти вправу</h2><p>${LIB.length} вправ у бібліотеці</p></div></div><div class="search-box">${icon('search')}<input class="field" type="search" placeholder="Пошук за назвою або м’язами…" value="${esc(libraryQuery)}" oninput="searchLibrary(this.value)"></div><div class="filter-row" style="margin-top:12px">${groups.map(g=>`<button class="choice ${libraryGroup===g?'active':''}" onclick="filterLibrary('${g}')">${g}</button>`).join('')}</div><div class="form-field" style="margin-top:15px;max-width:260px"><label>ДОДАВАТИ ДО</label><select class="field" onchange="libraryTarget=+this.value">${P.map((p,i)=>`<option value="${i}" ${libraryTarget===i?'selected':''}>День ${i+1} · ${esc(p.n)}</option>`).join('')}</select></div></div><div class="library-grid" id="library-grid">${list.map(x=>`<article class="library-card"><span class="muscle-tag">${x.g}</span><h3>${esc(x.n)}</h3><p><strong>Для чого:</strong> ${esc(x.p)}</p><p><strong>Техніка:</strong> ${esc(x.t)}</p><div class="library-add"><button class="btn btn-secondary btn-small" onclick="addLibraryExercise(${x.i},libraryTarget)">${icon('plus')} Додати до плану</button></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Нічого не знайдено. Спробуй інший запит.</div>'}</div>`;}
function searchLibrary(v){libraryQuery=v;const root=document.getElementById('library-grid');if(!root)return;const list=LIB.map((x,i)=>({...x,i})).filter(x=>(libraryGroup==='Усі'||x.g===libraryGroup)&&(!libraryQuery||`${x.n} ${x.p} ${x.g}`.toLowerCase().includes(libraryQuery.toLowerCase())));root.innerHTML=list.map(x=>`<article class="library-card"><span class="muscle-tag">${x.g}</span><h3>${esc(x.n)}</h3><p><strong>Для чого:</strong> ${esc(x.p)}</p><p><strong>Техніка:</strong> ${esc(x.t)}</p><div class="library-add"><button class="btn btn-secondary btn-small" onclick="addLibraryExercise(${x.i},libraryTarget)">${icon('plus')} Додати до плану</button></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Нічого не знайдено. Спробуй інший запит.</div>';}
function filterLibrary(g){libraryGroup=g;draw();}
function videoSearchUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' правильна техніка виконання українською');}
function videoItems(){const all=[...LIB];for(const p of P)for(const x of p.e)if(!all.some(y=>y.n.toLowerCase()===x[0].toLowerCase()))all.push({n:x[0],g:'Мій план',p:'Вправа з твого плану',t:'Переглянь демонстрацію руху перед виконанням.'});return all.map((x,i)=>({...x,i})).filter(x=>(videoGroup==='Усі'||x.g===videoGroup)&&(!videoQuery||`${x.n} ${x.g} ${x.p}`.toLowerCase().includes(videoQuery.toLowerCase())));}
function renderVideoCards(){const items=videoItems(),root=document.getElementById('video-results');if(!root)return;root.innerHTML=items.map(x=>`<article class="video-card"><div class="video-thumb"><span class="video-play">${icon('youtube')}</span><span class="video-thumb-label">ТЕХНІКА ВИКОНАННЯ</span><span class="video-watermark">IRONLOG</span></div><div class="video-card-body"><span class="muscle-tag">${esc(x.g)}</span><h3>${esc(x.n)}</h3><p>${esc(x.t||x.p)}</p><a class="btn btn-youtube" href="${videoSearchUrl(x.n)}" target="_blank" rel="noopener noreferrer">${icon('youtube')} Відео на YouTube ${icon('arrow')}</a></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Не знайшов вправу. Спробуй іншу назву.</div>';}
function renderVideos(){const groups=['Усі','Спина','Груди','Плечі','Руки','Ноги','Прес','Мій план'];return `<div class="page-heading"><div><div class="eyebrow">ДИВИСЬ · ВЧИСЬ · ВИКОНУЙ</div><h1>Техніка вправ</h1><p>Шукай демонстрації рухів і дивись, як правильно виконувати вправи.</p></div></div><section class="video-hero"><div><span class="video-hero-kicker">IRONLOG VIDEO GUIDE</span><h2>Спочатку техніка.<br><em>Потім вага.</em></h2><p>Обери вправу — відкриється актуальна добірка відео на YouTube за її назвою.</p></div><div class="video-hero-mark">▶</div></section><section class="panel"><div class="section-head"><div><h2>Знайти демонстрацію</h2><p>${videoItems().length} вправ доступні для пошуку відео.</p></div></div><div class="search-box">${icon('search')}<input class="field" type="search" placeholder="Наприклад, жим лежачи…" value="${esc(videoQuery)}" oninput="videoQuery=this.value;renderVideoCards()"></div><div class="filter-row" style="margin-top:12px">${groups.map(g=>`<button class="choice ${videoGroup===g?'active':''}" onclick="videoGroup='${g}';draw()">${g}</button>`).join('')}</div></section><div class="video-grid" id="video-results">${videoItems().map(x=>`<article class="video-card"><div class="video-thumb"><span class="video-play">${icon('youtube')}</span><span class="video-thumb-label">ТЕХНІКА ВИКОНАННЯ</span><span class="video-watermark">IRONLOG</span></div><div class="video-card-body"><span class="muscle-tag">${esc(x.g)}</span><h3>${esc(x.n)}</h3><p>${esc(x.t||x.p)}</p><a class="btn btn-youtube" href="${videoSearchUrl(x.n)}" target="_blank" rel="noopener noreferrer">${icon('youtube')} Відео на YouTube ${icon('arrow')}</a></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Не знайшов вправу. Спробуй іншу назву.</div>'}</div><div class="notice">Посилання відкривають пошук YouTube, а не випадкове застаріле відео. Так ти бачиш актуальні демонстрації та можеш вибрати тренера, мову й формат пояснення.</div><div class="footer-note">Відео надає YouTube. IRONLOG не зберігає та не завантажує чужі ролики.</div>`;}
function todayFood(){if(!S.foodLogs[foodDate])S.foodLogs[foodDate]={meals:[]};const x=S.foodLogs[foodDate];if(!Array.isArray(x.meals))x.meals=[];return x;}
function setFoodDate(value){if(!value)return;foodDate=value>todayISO()?todayISO():value;draw();}
function shiftFoodDate(delta){const d=parseISO(foodDate);d.setDate(d.getDate()+delta);const v=iso(d);if(v<=todayISO()){foodDate=v;draw();}}
function foodTotals(log){return (log.meals||[]).reduce((a,m)=>{const n=+m.portions||1;a.kcal+=(+m.kcal||0)*n;a.p+=(+m.p||0)*n;a.c+=(+m.c||0)*n;a.f+=(+m.f||0)*n;return a;},{kcal:0,p:0,c:0,f:0});}
function renderNutrition(){const log=todayFood(),t=foodTotals(log),goal=S.nutritionGoal,ratio=goal?Math.min(100,t.kcal/goal*100):0,types=['Сніданок','Обід','Вечеря','Перекус'];return `<div class="page-heading food-heading"><div><div class="eyebrow">ЇЖА ТА ВІДНОВЛЕННЯ</div><h1>Харчування</h1><p>Записуй прийоми їжі та дивись добову суму.</p></div><div class="food-date-picker"><button class="date-shift" onclick="shiftFoodDate(-1)" aria-label="Попередній день">‹</button><input class="field" type="date" value="${foodDate}" max="${todayISO()}" onchange="setFoodDate(this.value)"><button class="date-shift" onclick="shiftFoodDate(1)" aria-label="Наступний день" ${foodDate>=todayISO()?'disabled':''}>›</button></div></div><section class="nutrition-summary"><div class="nutrition-main"><span class="nutrition-overline">ЗА СЬОГОДНІ</span><div class="nutrition-calories">${Math.round(t.kcal)} <small>ккал</small></div><div class="nutrition-goal-line">${goal?`із ${goal.toLocaleString('uk-UA')} ккал`: 'добову ціль не задано'}</div><div class="nutrition-track"><i style="width:${ratio}%"></i></div></div><div class="macro-grid"><div><span>БІЛКИ</span><strong>${t.p.toFixed(1)}<small> г</small></strong></div><div><span>ВУГЛЕВОДИ</span><strong>${t.c.toFixed(1)}<small> г</small></strong></div><div><span>ЖИРИ</span><strong>${t.f.toFixed(1)}<small> г</small></strong></div></div></section><section class="panel"><div class="section-head"><div><h2>Добова ціль</h2><p>Необов’язково. Можеш просто вести журнал без ліміту.</p></div></div><div class="goal-editor"><input class="field" id="nutrition-goal" type="number" min="1" max="10000" placeholder="Ккал на день" value="${goal||''}"><button class="btn btn-secondary" onclick="saveNutritionGoal()">Зберегти ціль</button><button class="btn btn-ghost" onclick="clearNutritionGoal()">Без цілі</button></div></section><section class="panel"><div class="section-head"><div><h2>Додати їжу</h2><p>Внось значення з упаковки або зваженої порції.</p></div></div><div class="form-grid nutrition-form"><div class="form-field full"><label>НАЗВА ПРОДУКТУ / СТРАВИ</label><input class="field" id="meal-name" maxlength="70" placeholder="Наприклад, вівсянка з молоком"></div><div class="form-field"><label>ПРИЙОМ ЇЖІ</label><select class="field" id="meal-type">${types.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>КІЛЬКІСТЬ ПОРЦІЙ</label><input class="field" type="number" id="meal-portions" min="0.1" max="20" step="0.1" value="1"></div><div class="form-field"><label>КАЛОРІЇ НА ПОРЦІЮ</label><input class="field" type="number" id="meal-kcal" min="0" max="5000" placeholder="ккал"></div><div class="form-field"><label>БІЛКИ, Г</label><input class="field" type="number" id="meal-p" min="0" max="300" step="0.1" placeholder="г"></div><div class="form-field"><label>ВУГЛЕВОДИ, Г</label><input class="field" type="number" id="meal-c" min="0" max="500" step="0.1" placeholder="г"></div><div class="form-field"><label>ЖИРИ, Г</label><input class="field" type="number" id="meal-f" min="0" max="300" step="0.1" placeholder="г"></div><div class="form-field full"><button class="btn btn-primary" onclick="addMeal()">${icon('plus')} Додати до щоденника</button></div></div></section><section class="panel"><div class="section-head"><div><h2>Щоденник за день</h2><p>${log.meals.length} записів · суми рахуються автоматично.</p></div><strong class="meal-total">${Math.round(t.kcal)} ккал</strong></div>${log.meals.length?types.map(type=>{const items=log.meals.filter(m=>m.type===type);return items.length?`<div class="meal-group"><h3>${type}</h3>${items.map(m=>`<div class="meal-row"><div class="meal-info"><strong>${esc(m.name)}</strong><small>${m.portions} порц. · Б ${(+m.p||0)*m.portions} г · В ${(+m.c||0)*m.portions} г · Ж ${(+m.f||0)*m.portions} г</small></div><div class="meal-kcal">${Math.round(m.kcal*m.portions)} <small>ккал</small></div><button class="remove-btn" onclick="removeMeal(${m.id})" aria-label="Видалити запис">×</button></div>`).join('')}</div>`:''}).join(''):'<div class="empty-state">Тут поки порожньо. Додай перший прийом їжі.</div>'}</section><div class="notice"><strong>Важливо:</strong> калорії — лише орієнтир, а не оцінка того, наскільки добре ти харчуєшся. Під час росту не використовуй трекер для жорсткого обмеження їжі; добову ціль за потреби краще узгодити з лікарем або дієтологом.</div><div class="footer-note">Журнал зберігається приватно в цьому браузері.</div>`;}
function addMeal(){const name=document.getElementById('meal-name').value.trim(),kcal=+document.getElementById('meal-kcal').value,p=+document.getElementById('meal-p').value||0,c=+document.getElementById('meal-c').value||0,f=+document.getElementById('meal-f').value||0,portions=+document.getElementById('meal-portions').value||1,type=document.getElementById('meal-type').value;if(!name||document.getElementById('meal-kcal').value===''||kcal<0||portions<=0){showToast('Вкажи назву, калорії та кількість порцій');return;}const log=todayFood();log.meals.push({id:Date.now()+Math.floor(Math.random()*1000),name,kcal,p,c,f,portions,type});save();draw();showToast('Запис додано до щоденника');}
function removeMeal(id){const log=todayFood();log.meals=log.meals.filter(x=>x.id!==id);save();draw();showToast('Запис видалено');}
function saveNutritionGoal(){const x=+document.getElementById('nutrition-goal').value;if(!x||x<1||x>10000){showToast('Введи коректну ціль у ккал');return;}S.nutritionGoal=Math.round(x);save();draw();showToast('Добову ціль збережено');}
function clearNutritionGoal(){S.nutritionGoal=null;save();draw();showToast('Облік без добової цілі');}
function personalRecords(){const m={};for(const l of Object.values(S.logs)){for(const [ei,sets] of Object.entries(l.sets||{})){(sets||[]).forEach(s=>{if(s?.ok&&+s.w>0&&+s.r>0){const name=s.n||P[l.day]?.e?.[+ei]?.[0]||'Вправа';const e=estimate1RM(s.w,s.r);if(!m[name]||e>m[name].e)m[name]={e,w:s.w,r:s.r};}});}}return m;}
function estimate1RM(w,r){w=+w;r=+r;if(!w||!r)return 0;return r===1?w:w*(1+r/30);}
function chartMarkup(data,title,unit,key){if(data.length<2)return `<div class="chart-empty">Додай ще ${2-data.length} ${data.length===0?'заміри':'заміри'} — тут з’явиться графік.</div>`;const W=620,H=190,L=34,R=18,T=18,B=35,vals=data.map(x=>+x[key]).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const pts=data.map((d,i)=>({x:L+i*(W-L-R)/(data.length-1),y:T+(max-(+d[key]))/range*(H-T-B),v:+d[key],label:fmtDate(d.d,{day:'numeric',month:'short'})}));const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');const area=path+` L ${pts[pts.length-1].x} ${H-B} L ${pts[0].x} ${H-B} Z`;const grid=[0,1,2,3].map(i=>{const y=T+i*(H-T-B)/3;return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted-2)">${(max-i*range/3).toFixed(1)}</text>`}).join('');return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${grid}<path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${p.label}: ${p.v} ${unit}</title></circle>${(i===0||i===pts.length-1||i===Math.floor(pts.length/2))?`<text x="${p.x}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted-2)">${p.label}</text>`:''}`).join('')}</svg><div class="chart-legend"><span><i class="legend-dot" style="background:var(--accent)"></i>${title}, ${unit}</span><span>Останнє значення: <strong style="color:var(--text)">${vals[vals.length-1]} ${unit}</strong></span></div></div>`;}
function weeklyVolumes(){const out=[];const d=parseISO(todayISO());d.setDate(d.getDate()-((d.getDay()+6)%7)-49);for(let w=0;w<8;w++){let v=0,c=0;for(let j=0;j<7;j++){const s=iso(d),l=S.logs[s];if(l){if(l.done)c++;for(const sets of Object.values(l.sets||{}))(sets||[]).forEach(x=>{if(x?.ok)v+=(+x.w||0)*(+x.r||0);});}d.setDate(d.getDate()+1);}out.push({v,c});}return out;}
function volumeChart(){const data=weeklyVolumes(),max=Math.max(1,...data.map(x=>x.v));return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 620 190" role="img" aria-label="Тоннаж за останні вісім тижнів">${data.map((x,i)=>{const barH=x.v/max*112,xx=25+i*75;return `<rect x="${xx}" y="${137-barH}" width="40" height="${barH}" rx="7" fill="var(--accent)" opacity="${.45+i*.07}"/><text x="${xx+20}" y="${Math.max(17,130-barH)}" text-anchor="middle" font-size="10" fill="var(--text)">${x.v?Math.round(x.v/100)/10+'т':'—'}</text><text x="${xx+20}" y="157" text-anchor="middle" font-size="10" fill="var(--muted-2)">${i+1}</text><text x="${xx+20}" y="174" text-anchor="middle" font-size="9" fill="var(--muted-2)">${x.c}/${scheduledCount()}</text>`}).join('')}</svg><div class="chart-legend"><span>Останні 8 тижнів: тоннаж та кількість завершених тренувань.</span></div></div>`;}
function renderCalendar(){const first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,days=new Date(calendarYear,calendarMonth+1,0).getDate();let html=`<div class="month-head"><strong>${MONTHS[calendarMonth]} ${calendarYear}</strong><div class="month-arrows"><button onclick="moveMonth(-1)" aria-label="Попередній місяць">‹</button><button onclick="moveMonth(1)" aria-label="Наступний місяць">›</button></div></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}`;for(let i=0;i<offset;i++)html+='<div class="calendar-day empty"></div>';for(let d=1;d<=days;d++){const date=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,state=S.logs[date]?.done?'completed':(schedule(date)!==undefined&&date<todayISO()&&date>=S.start?'missed':schedule(date)!==undefined?'scheduled':''),today=date===todayISO(),future=date>todayISO();html+=`<button class="calendar-day ${state} ${today?'today':''} ${future?'future':''}" ${future?'disabled':`onclick="toggleCalendarDay('${date}')"`} title="${date}">${d}<small>${state==='completed'?'✓':state==='missed'?'×':state==='scheduled'?'•':''}</small></button>`;}return html+'</div>';}
function moveMonth(delta){calendarMonth+=delta;if(calendarMonth<0){calendarMonth=11;calendarYear--;}if(calendarMonth>11){calendarMonth=0;calendarYear++;}const el=document.getElementById('calendar');if(el)el.innerHTML=renderCalendar();}
function toggleCalendarDay(date){const l=S.logs[date];if(l?.done){if(!confirm('Зняти відмітку про тренування за цей день?'))return;S.logs[date].done=false;}else{S.logs[date]={day:schedule(date)??0,sets:l?.sets||{},done:true};}save();draw();}
function renderProgress(){const sorted=S.body.slice().sort((a,b)=>a.d.localeCompare(b.d)),latest=sorted[sorted.length-1]||{},prs=personalRecords(),prKeys=Object.keys(prs).sort((a,b)=>prs[b].e-prs[a].e).slice(0,8),n=doneDates().length;const achievements=[['🏁','Перше тренування','Зроби перший запис',n>=1],['🔟','10 тренувань','Тримай регулярність',n>=10],['💯','25 тренувань','Стабільна робота',n>=25],['🔥','Серія 7 днів','Сім тренувальних днів',streak()>=7],['🏋️','10 тонн','Загальний тоннаж',totalVolume()>=10000],['📏','−2 см талії','Зміна замірів',sorted.filter(x=>x.t!=null).length>1&&Math.max(...sorted.filter(x=>x.t!=null).map(x=>x.t))-Math.min(...sorted.filter(x=>x.t!=null).map(x=>x.t))>=2]];return `<div class="page-heading"><div><div class="eyebrow">ЦИФРИ, ЯКІ ПОКАЗУЮТЬ РОБОТУ</div><h1>Твій прогрес</h1><p>Відстежуй динаміку, а не лише цифру на вагах.</p></div></div><div class="two-col"><section class="panel"><div class="section-head"><div><h2>Заміри тіла та сили</h2><p>Додавай новий запис, коли хочеш відстежити зміни.</p></div></div><div class="form-grid"><div class="form-field"><label>Вага, кг</label><input class="field" id="body-weight" type="number" step="0.1" inputmode="decimal" placeholder="Наприклад, 75" value="${latest.w??''}"></div><div class="form-field"><label>Талія, см</label><input class="field" id="body-waist" type="number" step="0.1" inputmode="decimal" placeholder="Наприклад, 78" value="${latest.t??''}"></div><div class="form-field full"><label>Жим лежачи, кг · робоча вага</label><input class="field" id="body-bench" type="number" step="0.5" inputmode="decimal" placeholder="Наприклад, 40" value="${latest.b??''}"></div><div class="form-field full"><button class="btn btn-primary" onclick="saveBody()">${icon('check')} Зберегти заміри</button></div></div></section><section class="panel"><div class="section-head"><div><h2>Загальна статистика</h2><p>Усе зафіксоване в IRONLOG.</p></div></div><div class="three-col" style="grid-template-columns:1fr 1fr"><div class="mini-stat"><span>Тренування</span><strong>${n}</strong></div><div class="mini-stat"><span>Тоннаж</span><strong>${(totalVolume()/1000).toFixed(1)} т</strong></div><div class="mini-stat"><span>Серія</span><strong>${streak()} дн.</strong></div><div class="mini-stat"><span>Цього тижня</span><strong>${weeklyCount()}/${scheduledCount()}</strong></div></div></section></div>
<div class="two-col"><section class="panel"><div class="section-head"><div><h2>Динаміка ваги</h2><p>За всіма збереженими замірами.</p></div></div>${chartMarkup(sorted.filter(x=>x.w!=null),'Вага','кг','w')}</section><section class="panel"><div class="section-head"><div><h2>Динаміка талії</h2><p>Заміри в сантиметрах.</p></div></div>${chartMarkup(sorted.filter(x=>x.t!=null),'Талія','см','t')}</section></div>
<section class="panel"><div class="section-head"><div><h2>Тоннаж за тижнями</h2><p>Обсяг виконаної роботи за останні 8 тижнів.</p></div></div>${volumeChart()}</section>
<div class="two-col"><section class="panel"><div class="section-head"><div><h2>Особисті рекорди</h2><p>Орієнтовний максимум на одне повторення (1ПМ).</p></div></div>${prKeys.length?`<div class="table-scroll"><table class="history-table"><thead><tr><th>Вправа</th><th>Найкращий підхід</th><th>1ПМ</th></tr></thead><tbody>${prKeys.map(k=>`<tr><td><strong>${esc(k)}</strong></td><td>${esc(prs[k].w)} × ${esc(prs[k].r)}</td><td><strong>${prs[k].e.toFixed(1)} кг</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Поки немає записів.<br>Відміть виконаний підхід — рекорди з’являться тут.</div>'}</section><section class="panel"><div class="section-head"><div><h2>Досягнення</h2><p>Маленькі кроки складаються у великий результат.</p></div></div><div class="achievement-grid">${achievements.map(a=>`<div class="achievement ${a[3]?'unlocked':''}"><span class="achievement-icon">${a[0]}</span><div><strong>${a[1]}</strong><small>${a[2]}</small></div></div>`).join('')}</div></section></div>
<section class="panel"><div class="section-head"><div><h2>Календар тренувань</h2><p>Натисни на минулу дату, щоб змінити відмітку.</p></div></div><div id="calendar">${renderCalendar()}</div><div class="chart-legend"><span><i class="legend-dot" style="background:var(--green)"></i>Виконано</span><span><i class="legend-dot" style="background:var(--red)"></i>Пропущено за планом</span><span><i class="legend-dot" style="background:var(--accent)"></i>Сьогодні</span></div></section>
${sorted.length?`<section class="panel"><div class="section-head"><div><h2>Історія замірів</h2><p>${sorted.length} записів збережено.</p></div><button class="btn btn-ghost btn-small" onclick="clearBody()">Очистити історію</button></div><div class="table-scroll"><table class="history-table"><thead><tr><th>Дата</th><th>Вага</th><th>Талія</th><th>Жим</th><th></th></tr></thead><tbody>${sorted.slice().reverse().map(x=>`<tr><td><strong>${fmtDate(x.d,{day:'numeric',month:'short',year:'numeric'})}</strong></td><td>${x.w??'—'} кг</td><td>${x.t??'—'} см</td><td>${x.b??'—'} кг</td><td><button class="remove-btn" onclick="deleteBody('${x.d}')" title="Видалити запис">×</button></td></tr>`).join('')}</tbody></table></div></section>`:''}<div class="footer-note">Результат — це послідовність, а не один день.</div>`;}
function saveBody(){const w=document.getElementById('body-weight').value,t=document.getElementById('body-waist').value,b=document.getElementById('body-bench').value;if(!w&&!t&&!b){showToast('Введи хоча б один показник');return;}const d=todayISO();S.body=S.body.filter(x=>x.d!==d);S.body.push({d,w:w===''?null:+w,t:t===''?null:+t,b:b===''?null:+b});S.body.sort((a,b)=>a.d.localeCompare(b.d));save();draw();showToast('Заміри збережено');}
function deleteBody(date){S.body=S.body.filter(x=>x.d!==date);save();draw();showToast('Запис видалено');}
function clearBody(){if(!confirm('Видалити всі заміри тіла?'))return;S.body=[];save();draw();showToast('Історію замірів очищено');}
function renderSettings(){return `<div class="page-heading"><div><div class="eyebrow">НАЛАШТУЙ ПІД СЕБЕ</div><h1>Налаштування</h1><p>Керуй виглядом, таймером і резервними копіями.</p></div></div><section class="panel"><div class="section-head"><div><h2>Зовнішній вигляд</h2><p>Вибери тему інтерфейсу.</p></div></div><div class="setting-row"><div><strong>Тема оформлення</strong><small>Темна або світла тема.</small></div><div class="segmented"><button class="${S.theme==='dark'?'active':''}" onclick="setTheme('dark');draw()">Темна</button><button class="${S.theme==='light'?'active':''}" onclick="setTheme('light');draw()">Світла</button></div></div></section>
<section class="panel"><div class="section-head"><div><h2>Таймер відпочинку</h2><p>Автоматично запускається після відмітки підходу.</p></div></div><div class="setting-row"><div><strong>Тривалість паузи</strong><small>Можна змінити під час тренування.</small></div><div class="segmented">${[60,90,120,180].map(x=>`<button class="${S.rest===x?'active':''}" onclick="S.rest=${x};save();draw()">${x<60?x:x/60+(x%60?':'+String(x%60).padStart(2,'0'):' хв')}</button>`).join('')}</div></div></section>
<section class="panel"><div class="section-head"><div><h2>Калькулятори</h2><p>Допоміжні інструменти для тренування.</p></div></div><div class="two-col"><div><div class="form-field"><label>РОЗРАХУНОК 1ПМ · ВАГА, КГ</label><input class="field" type="number" id="calc-weight" step="0.5" placeholder="Наприклад, 50"></div><div class="form-field" style="margin-top:9px"><label>ПОВТОРЕННЯ</label><input class="field" type="number" id="calc-reps" min="1" max="20" placeholder="Наприклад, 8"></div><button class="btn btn-secondary" style="margin-top:10px" onclick="calculate1RM()">Порахувати 1ПМ</button><div id="calc-result" class="tipline" style="margin-top:9px"></div></div><div><div class="form-field"><label>ЦІЛЬОВА ВАГА НА ГРИФІ, КГ</label><input class="field" type="number" id="plate-total" step="0.5" placeholder="Наприклад, 60"></div><div class="form-field" style="margin-top:9px"><label>ВАГА ГРИФА, КГ</label><input class="field" type="number" id="plate-bar" value="20" step="0.5"></div><button class="btn btn-secondary" style="margin-top:10px" onclick="calculatePlates()">Підібрати диски</button><div id="plate-result" class="tipline" style="margin-top:9px"></div></div></div></section>
<section class="panel"><div class="section-head"><div><h2>Резервна копія</h2><p>Зроби експорт, щоб не втратити історію при зміні браузера або пристрою.</p></div></div><div class="section-actions"><button class="btn btn-primary" onclick="exportData()">${icon('download')} Експортувати дані</button><label class="btn btn-secondary" for="import-file" style="cursor:pointer">${icon('upload')} Імпортувати дані</label><input id="import-file" type="file" accept="application/json,.json" hidden onchange="importData(this)"></div><div class="notice" style="margin-top:14px">Усі тренування, заміри та налаштування зберігаються локально в цьому браузері. Вони не синхронізуються автоматично між пристроями.</div></section>
<section class="panel"><div class="section-head"><div><h2>Керування даними</h2><p>Ці дії не можна скасувати.</p></div></div><div class="section-actions"><button class="btn btn-ghost" onclick="clearLogs()">Очистити журнал тренувань</button><button class="btn btn-ghost" onclick="clearBody()">Очистити заміри</button><button class="btn btn-danger" onclick="wipeAll()">${icon('trash')} Видалити всі дані</button></div></section>
<div class="footer-note">IRONLOG · Версія 3.0 · Твій зал, твій план</div>`;}
function calculate1RM(){const w=+document.getElementById('calc-weight').value,r=+document.getElementById('calc-reps').value,el=document.getElementById('calc-result');if(!w||!r||r<1||r>20){el.textContent='Введи вагу та від 1 до 20 повторень.';return;}el.innerHTML=`Орієнтовний 1ПМ: <strong style="color:var(--accent)">${estimate1RM(w,r).toFixed(1)} кг</strong>`;}
function calculatePlates(){const t=+document.getElementById('plate-total').value,b=+document.getElementById('plate-bar').value||20,el=document.getElementById('plate-result');if(!t||t<b){el.textContent='Загальна вага має бути не меншою за вагу грифа.';return;}let rem=(t-b)/2;const plates=[25,20,15,10,5,2.5,1.25],out=[];for(const p of plates){const n=Math.floor((rem+1e-8)/p);if(n){out.push(`${n} × ${p} кг`);rem-=n*p;}}el.innerHTML=`На кожен бік: <strong style="color:var(--accent)">${out.join(' + ')||'без дисків'}</strong>${rem>.01?`<br><small>Не вдалося набрати ще ${rem.toFixed(2)} кг на бік стандартними дисками.</small>`:''}`;}
function exportData(){const blob=new Blob([JSON.stringify({...S,plan:P},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ironlog-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('Резервну копію створено');}
function importData(input){const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.logs!=='object'||!Array.isArray(o.body))throw new Error('invalid');if(!confirm('Замінити поточні дані інформацією з резервної копії?'))return;S={...loadState(),...o};if(Array.isArray(o.plan))P=o.plan;save();draw();showToast('Дані успішно імпортовано');}catch(e){showToast('Файл резервної копії некоректний');}finally{input.value='';}};r.readAsText(file);}
function clearLogs(){if(!confirm('Очистити всі записи тренувань? План і заміри залишаться.'))return;S.logs={};S.start=todayISO();save();draw();showToast('Журнал тренувань очищено');}
function wipeAll(){if(prompt('Це видалить усі тренування, заміри, план і налаштування. Введи ВИДАЛИТИ для підтвердження:')!=='ВИДАЛИТИ')return;try{localStorage.removeItem(STORE_KEY);}catch(e){}location.reload();}
function startTimer(seconds){timerEnd=Date.now()+seconds*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerUI,250);updateTimerUI();}
function updateTimerUI(){const bar=document.getElementById('timer-bar');if(!bar)return;if(!timerEnd){bar.classList.remove('visible');return;}const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(left<=0){stopTimer();showToast('Час наступного підходу!');try{navigator.vibrate?.([180,100,180]);}catch(e){}return;}document.getElementById('timer-value').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.classList.add('visible');}
function adjustTimer(delta){if(!timerEnd)return;timerEnd=Math.max(Date.now()+1000,timerEnd+delta*1000);updateTimerUI();}
function stopTimer(){timerEnd=0;if(timerInterval){clearInterval(timerInterval);timerInterval=null;}updateTimerUI();}

document.getElementById('brand-icon').innerHTML=icon('bolt');document.getElementById('mobile-brand-icon').innerHTML=icon('bolt');
document.documentElement.dataset.theme=S.theme;document.getElementById('theme-toggle').addEventListener('click',()=>setTheme(S.theme==='dark'?'light':'dark'));
if(!P.length)P=deep(DEFAULT_PLAN);
draw();
</script>
